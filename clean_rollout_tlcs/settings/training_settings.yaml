# clean_rollout_tlcs — training / control configuration
# Validated by clean_rollout_tlcs.settings.Settings (Pydantic).

# --- control mode (drives evaluation; training always fits the DQN) ---
# one of: dqn | fixed_time | greedy | rollout_1s | rollout_ms
mode: dqn

# --- simulation ---
gui: false
total_episodes: 100
max_steps: 5400
n_cars_generated: 1000
green_duration: 10
yellow_duration: 4
turn_chance: 0.25

# --- model (MLP: 4 hidden blocks x 400 units over the 12-D state) ---
num_layers: 4
width_layers: 400
batch_size: 100
learning_rate: 0.001
training_epochs: 800

# --- replay memory ---
memory_size_min: 600
memory_size_max: 50000

# --- agent ---
# gamma is a PER-SECOND discount; the bootstrap / rollout tail uses gamma**Delta.
gamma: 0.98

# --- stage cost g (canonical = linear unserved-queue delay) ---
cost_type: linear
cost_quadratic_kappa: 10.0
switch_penalty: 0.0

# --- rollout ---
lookahead_depth: 1
beta: 1.0
rollout_truncation: 60

# --- transition model f (physics; calibrate against SUMO in Phase 2) ---
saturation_flow: 0.5
startup_lost_time: 2.0

# --- causal upstream detector (virtual loop detector + travel-time lag) ---
detector_window: 100
detector_lag_tau: 45.8

# --- evaluation harness ---
# eval seeds are 100000..100029 — provably disjoint from the training route
# seeds (training_seed*10000 + episode), so evaluation traffic never leaks.
n_eval_seeds: 30
eval_seed_start: 100000

# --- paths ---
sumocfg_file: intersection/sumo_config.sumocfg
