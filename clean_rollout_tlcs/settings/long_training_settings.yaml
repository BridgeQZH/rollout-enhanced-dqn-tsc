# clean_rollout_tlcs — LONG-HORIZON training configuration
# ---------------------------------------------------------------------------
# Purpose: fully converge the DQN value function over a long schedule, keeping
# 3 independent seeds (0,1,2). Identical physics / locked parameters to
# training_settings.yaml so results stay directly comparable; ONLY the training
# horizon is scaled up.
#
# Epsilon schedule (defined in train.py, not configurable without code changes):
#     epsilon = max(0, 1 - episode / total_episodes)   # linear anneal
# With total_episodes = 500 this decays gracefully across the WHOLE run instead
# of collapsing early:
#     ep   0  -> eps 1.00      ep 250 -> eps 0.50
#     ep 100  -> eps 0.80      ep 400 -> eps 0.20
#     ep 200  -> eps 0.60      ep 490 -> eps 0.02   (near-greedy only at the end)
# i.e. exploration is sustained, then the final episodes exploit to stabilise.
# ---------------------------------------------------------------------------

# --- control mode (training always fits the DQN; mode drives evaluation) ---
mode: dqn

# --- simulation (IDENTICAL to training_settings.yaml for fair comparison) ---
gui: false
total_episodes: 500          # scaled up from 100 for full convergence
max_steps: 5400
n_cars_generated: 1000
green_duration: 10
yellow_duration: 4
turn_chance: 0.25

# --- model (MLP: 4 hidden blocks x 400 units over the 12-D state) ---
num_layers: 4
width_layers: 400
batch_size: 100
learning_rate: 0.001
training_epochs: 800

# --- replay memory ---
memory_size_min: 600
memory_size_max: 50000

# --- agent ---
# gamma is a PER-SECOND discount; the bootstrap / rollout tail uses gamma**Delta.
gamma: 0.98

# --- stage cost g (canonical = linear unserved-queue delay) ---
cost_type: linear
cost_quadratic_kappa: 10.0
switch_penalty: 0.0

# --- rollout (locked) ---
lookahead_depth: 1
beta: 1.0
rollout_truncation: 60

# --- transition model f (physics; locked) ---
saturation_flow: 0.5
startup_lost_time: 2.0

# --- causal upstream detector (virtual loop detector + travel-time lag) ---
detector_window: 100
detector_lag_tau: 45.8

# --- evaluation harness (eval seeds disjoint from training route seeds) ---
n_eval_seeds: 30
eval_seed_start: 100000

# --- paths ---
sumocfg_file: intersection/sumo_config.sumocfg
