[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rollout-tlcs"
version = "1.0.0"
description = "Rollout-enhanced DQN for adaptive traffic signal control: amortized learning + online search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zihan Qiao" }]
keywords = ["reinforcement-learning", "rollout", "traffic-signal-control", "approximate-dynamic-programming", "SUMO"]

dependencies = [
    "torch>=2.9",
    "numpy>=2.3",
    "pydantic>=2.12",
    "PyYAML>=6.0",
    "matplotlib>=3.10",
    "traci>=1.24",
    "sumolib>=1.24",
]

[project.urls]
Homepage = "https://github.com/zihanqiao/rollout-tlcs"

# Only the research engine is a distributable package.
[tool.setuptools]
packages = ["clean_rollout_tlcs"]

[tool.ruff]
line-length = 110
target-version = "py311"
